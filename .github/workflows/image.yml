name: image

# The server image ghcr.io/<owner>/whetstone (linux/amd64). A merge to main pushes :sha-<12 characters of the commit>, a tag v<Version>
# pushes :<Version> as well; a pull request only builds, so a broken Dockerfile fails before the merge. The digest to pin is in the
# run summary and the digest output.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, global.json, Directory.Build.props, 'src/**', 'schemas/**', .github/workflows/image.yml]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check a tag against Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - run: docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$SHA_TAG" .
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        if: github.event_name != 'pull_request'
      - run: |
          docker push "$IMAGE:$SHA_TAG"
          if [ -n "${VERSION:-}" ]; then
            docker tag "$IMAGE:$SHA_TAG" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi
        if: github.event_name != 'pull_request'
      - name: Digest to pin
        id: digest
        if: github.event_name != 'pull_request'
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SHA_TAG")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image (linux/amd64): pin this" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
