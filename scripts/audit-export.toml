# gitleaks settings for scripts/audit-export.sh only: the default rules, minus words that read as keys in ordinary prose.
# Each entry is a whole secret as gitleaks extracts it, checked by hand as not a credential.
[extend]
useDefault = true

[[allowlists]]
description = "Ordinary words the generic-api-key rule takes for a key after 'key,' or 'Valkey,'"
regexTarget = "secret"
regexes = ['''(?i)\A(s3-compatible)\z''']

# Sourcegraph's rule reads any 40 hex digits as a token, and a git commit hash is exactly that. Allowed only where the text
# names it a commit ("commit": "<hash>", as chargehand's context carries it); a bare 40-hex string is still a finding.
[[allowlists]]
description = "A git commit hash in a commit field"
targetRules = ["sourcegraph-access-token"]
regexTarget = "line"
regexes = ['''commit\\?"\s*:\s*\\?"[0-9a-f]{40}\\?"''']
